{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Login — Vision{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="hero-bg">
    <div class="blob blob-1" id="blob1"></div>
    <div class="blob blob-2" id="blob2"></div>
  </div>
  <div class="glass auth-card reveal-scale is-visible">
    <div class="brand"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Vision"><span>Vision</span></div>
    <h2>Welcome back</h2>
    <p class="sub">Log in to your Vision account.</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="field-group">
        <label>Email address</label>
        <input class="field-input" type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="password-wrap">
          <input class="field-input" type="password" name="password" id="loginPassword" placeholder="••••••••" required>
          <button type="button" class="password-toggle" data-toggle-target="loginPassword">{{ icon('eye', 'icon icon-sm') }}</button>
        </div>
      </div>
      <div class="auth-links">
        <span></span>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="auth-footer-text">Don't have an account? <a href="{{ url_for('signup') }}">Create Account</a></p>
  </div>
</div>
{% endblock %}
