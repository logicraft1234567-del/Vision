{% from "_icons.html" import icon %}
{% macro topbar(action_url) %}
<div class="dash-topbar">
  <button class="icon-btn sidebar-toggle-btn" type="button" id="sidebarToggle" title="Menu">{{ icon('menu', 'icon icon-sm') }}</button>
  <form class="search-bar" action="{{ action_url }}" method="get">
    {{ icon('search', 'icon icon-sm') }}
    <input type="text" name="q" placeholder="Search projects, builders...">
  </form>
  <div class="topbar-actions">
    <button class="icon-btn" type="button" id="openUserSearchBtn" title="Find People">{{ icon('user-search', 'icon icon-sm') }}</button>
    <div class="notif-wrap" id="notifWrap">
      <button class="icon-btn" type="button" id="notifBellBtn" title="Notifications">
        {{ icon('bell', 'icon icon-sm') }}
        <span class="notif-count-badge" id="notifCountBadge" hidden>0</span>
      </button>
      <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-head">
          <h4>Notifications</h4>
          <div class="notif-panel-head-actions">
            <button type="button" class="notif-mark-all-btn" id="notifMarkAllBtn">Mark all read</button>
            <button type="button" class="notif-mark-all-btn notif-clear-all-btn" id="notifClearAllBtn">Clear all</button>
          </div>
        </div>
        <div class="notif-tabs" id="notifTabs"></div>
        <div class="notif-list" id="notifList">
          <div class="notif-empty">Loading…</div>
        </div>
      </div>
    </div>
    <div class="avatar">
      {% if current_user.avatar_url %}
        <img src="{{ current_user.avatar_url }}" alt="{{ current_user.display_name }}">
      {% else %}
        {{ current_user.display_name[0]|upper if current_user.display_name else 'V' }}
      {% endif %}
    </div>
  </div>
</div>
<div class="badge-toast-stack" id="badgeToastStack"></div>
{% endmacro %}
